[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dfu-cross-domain"
version = "0.1.0"
description = "A Lightweight Domain-Generalized and Uncertainty-Aware Framework for Reliable Cross-Dataset Diabetic Foot Ulcer Segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Note: PyTorch is hardware-dependent and should be installed separately.
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "albumentations>=1.3.1",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

