# Preprocessing and Transformation Pipeline Specifications
preprocessing:
  target_dimensions:
    width: 512
    height: 512
    channels: 3
  
  spatial_transform:
    method: "aspect_ratio_preserving_letterbox"
    padding_color_rgb: [0, 0, 0]
    mask_fill_value: 0
  
  interpolation:
    # Strictly separated interpolation kernels
    image_kernel: "bilinear"      # Continuous optical interpolation
    mask_kernel: "nearest_neighbor" # Categorical label integrity preservation
  
  normalization:
    # Standard ImageNet pre-training normalization parameters (applied during batch loading)
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  
  mask_binarization:
    canonical_threshold: 128
    sensitivity_analysis_thresholds: [64, 96, 128, 160, 192]
  
  boundary_loss_specification:
    tolerance_deadband_tau_pixels: 2.0
    maximum_distance_cap_pixels: 20.0
    empty_mask_penalty: 0.0
  
  postprocessing_restrictions:
    enable_component_size_filtering: false  # PROHIBITED: preserves authentic micro-lesions
    negative_control_decision_floor_pixels: 10

